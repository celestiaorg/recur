# Tools and tasks for Recur. `mise install` once, then `mise run <task>`
# (`mise tasks` lists them). Rust itself comes from rust-toolchain.toml.

[tools]
node = "22.23.4"
pnpm = "10.34.3"
nfpm = "2.48.0"
# uv lets mise install dmgbuild (macOS DMG layout) without a system Python.
uv = "0.13.6"
"pipx:dmgbuild" = { version = "1.6.7", os = ["macos"] }

[tasks.build]
description = "Builds the desktop app and CLI into target/ (`-- --release` for a release build)"
run = "cargo build"

[tasks.run]
description = "Runs the desktop app on the engine-backed services (data dir defaults to RecurNext; `-- --features mock` for the mock bridge)"
run = "cargo run -p recur-desktop"

[tasks.lint]
description = "rustfmt check, clippy and the crate layering check"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test -p recur-layering",
]

[tasks."lint:bundles"]
description = "Lints the shipped Recur Bundles (schema, TS compile, shebang, keyEquivalent collisions)"
run = "cargo run -p recur-cli -- bundles lint ./bundles"

[tasks.test]
description = "Runs the workspace tests"
run = "cargo test --workspace"

[tasks."test:bundles"]
description = "Runs the shipped Recur Bundle engine tests (needs node on PATH)"
run = "cargo run -p recur-cli -- bundles test ./bundles"

[tasks.check]
description = "Quality gate before merging: lint, the workspace tests and the shipped bundles' lint and tests"
run = [{ task = "lint" }, { task = "test" }, { task = "lint:bundles" }, { task = "test:bundles" }]

[tasks."check:cursor-sdk-pin"]
description = "Fails if PyPI cursor-sdk is ahead of PINNED_SDK_VERSION (network; flags a re-pin)"
env = { RECUR_CURSOR_SDK_PIN_CHECK = "1" }
run = "cargo test -p recur-provider-cursor --lib check_cursor_sdk_pin_drift -- --nocapture"

[tasks."generate:help-skill"]
description = "Copies the user docs (src-docs) into the shipped recur-help skill that the app embeds"
run = "rsync -a --delete --include='*/' --include='*.mdx' --exclude='*' src-docs/src/pages/ recur-skills/recur-help/references/"

[tasks."generate:icons"]
description = "Compiles build/appicon.icon into build/darwin/Assets.car and icons.icns (macOS 26+ actool)"
dir = "build"
run = '''
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
/usr/bin/actool "$PWD/appicon.icon" --compile "$tmp" --notices --warnings --errors \
  --output-partial-info-plist "$tmp/partial.plist" --app-icon appicon \
  --enable-on-demand-resources NO --development-region en --target-device mac \
  --minimum-deployment-target 26.0 --platform macosx >/dev/null
mv "$tmp/Assets.car" darwin/Assets.car
mv "$tmp"/*.icns darwin/icons.icns
'''

[tasks.package]
description = "Packages target/package/Recur Next.app, .dmg and updater .zip (macOS; see build/darwin/package.sh for UNIVERSAL, signing and the update URL)"
depends = ["generate:icons", "generate:help-skill"]
run = "build/darwin/package.sh"

[tasks."smoke:package"]
description = "Installs target/package/Recur Next.dmg into a sandbox, launches it and checks the recur-next link, `recur-next .` and a native notification (macOS)"
run = "build/darwin/smoke.sh"

[tasks.smoke]
description = "Boots the desktop on a sandbox built from a Recur data dir (read only) and drives every view: `mise run smoke -- <data dir> [sandbox dir]`"
run = "cargo run -p recur-desktop --example real_data_smoke --"

[tasks."linux:test"]
description = "rustfmt, clippy and the tests on Linux (natively on Linux, in build/linux/Dockerfile elsewhere; WebKitGTK tests under xvfb-run)"
run = "build/linux/in-docker.sh sh -c 'cargo fmt --all --check && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && xvfb-run -a cargo test --workspace --all-features --locked'"

[tasks."linux:test:wpe"]
description = "The WPE WebKit HTML preview spike's checks (recur-content tests/wpe.rs) in build/linux/wpe.Dockerfile, which builds WPE 2.54 on first use (long)"
env = { WPE = "1" }
run = "build/linux/in-docker.sh sh -c 'cargo clippy -p recur-content --all-targets --locked -- -D warnings && cargo test -p recur-content --test wpe --locked'"

[tasks."linux:build"]
description = "Release Linux build into target/package/recur-next-linux-<arch> (recur, recur-cli, recur.png; in Docker on non-Linux hosts). ARCH=amd64|arm64 overrides the host arch"
depends = ["generate:help-skill"]
run = '''
set -eu
VERSION="${VERSION:-$(build/version.sh)}" build/linux/in-docker.sh build/linux/build.sh
'''

[tasks."linux:package"]
description = "Packages target/package/recur-next-linux-<arch>.tar.gz, .deb and .rpm (install to /opt/recur-next with /usr/bin/recur-next)"
run = '''
set -eu
export VERSION="${VERSION:-$(build/version.sh)}"
export ARCH="$(build/linux/arch.sh)"
mise run linux:build
PKG="recur-next-linux-$ARCH"
tar --no-xattrs -C target/package -czf "target/package/$PKG.tar.gz" "$PKG"
for fmt in deb rpm; do
  PKG_DIR="target/package/$PKG" nfpm pkg --packager "$fmt" --config build/linux/nfpm.yaml --target "target/package/$PKG.$fmt"
done
'''

[tasks."linux:run"]
description = "Builds for Linux and runs it (natively on Linux; elsewhere on a Docker desktop at http://127.0.0.1:6081 via noVNC)"
run = '''
set -eu
export ARCH="$(build/linux/arch.sh)"
mise run linux:build
if [ "$(uname -s)" = Linux ]; then exec "target/package/recur-next-linux-$ARCH/recur"; fi
exec build/linux/run-desktop.sh
'''

[tasks."linux:smoke"]
description = "Installs the linux:package .deb and tarball in a clean Debian 13 container and checks paths, the recur-next link, the menu entry, `recur-next .` and a notification"
run = "ARCH=\"$(build/linux/arch.sh)\" build/linux/smoke.sh"

[tasks."test:splash"]
description = "Builds the splash page and checks the real interactive app demo"
run = [
  "pnpm --dir src-web install --frozen-lockfile",
  "pnpm --dir src-web run build",
  "node scripts/check-splash.mjs",
]

[tasks."capture:splash"]
description = "Captures the app demo using the product dataset and named screen presets (`-- --screen workspace --theme charcoal`)"
run = [
  "pnpm --dir src-web/demo install --frozen-lockfile",
  "pnpm --dir src-web/demo run build",
  "node scripts/capture-splash.mjs",
]

[tasks."fetch:tm-grammars"]
description = "Re-fetches TextMate grammars from shikijs/textmate-grammars-themes into bundles/Languages"
run = "node scripts/fetch-tm-grammars.mjs"

[tasks."fetch:tm-themes"]
description = "Re-fetches pack TextMate themes from shikijs/tm-themes (+ Aura) into bundles/Themes"
run = "node scripts/fetch-tm-themes.mjs"

[tasks."port:filmgirl-themes"]
description = "Converts filmgirl TextMate plists into local theme ports (skips mods; does not fetch Shiki)"
run = ["node scripts/port-filmgirl-themes.mjs", "node scripts/fetch-tm-themes.mjs --local-only"]

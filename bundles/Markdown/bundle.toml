fileGlob = "*.{md,markdown,mdown,mdx}"
input = "selection"
fallbackInput = "word"
output = "replaceInput"
triggers = ["palette"]
interpreter = "typescript"
script = "src/inline-code.ts"

[[command]]
id = "recur.markdown.link"
name = "Link"
category = "Markdown"
order = 14
scope = "text.html.markdown"
fileGlob = "*.{md,markdown,mdown,mdx}"
input = "selection"
fallbackInput = "word"
output = "insertSnippet"
triggers = ["palette"]
interpreter = "typescript"
script = "src/link.ts"

[[command]]
id = "recur.markdown.increase-heading"
name = "Increase Heading"
category = "Markdown"
order = 20
scope = "text.html.markdown"
fileGlob = "*.{md,markdown,mdown,mdx}"
input = "selection"
fallbackInput = "line"

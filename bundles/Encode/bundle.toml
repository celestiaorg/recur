[bundle]
name = "Encode"
id = "recur.encode"
version = "1.0.0"
author = "Recur"

[[command]]
id = "recur.encode.url-encode"
name = "URL Encode"
category = "Encode"
order = 10
input = "selection"
fallbackInput = "document"
output = "replaceInput"
triggers = ["palette"]
keyEquivalent = "ctrl+shift+e"
interpreter = "typescript"
script = "src/url-encode.ts"

[[command]]
id = "recur.encode.url-decode"
name = "URL Decode"
category = "Encode"
order = 11

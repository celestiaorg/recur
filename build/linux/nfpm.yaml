# .deb / .rpm / .pkg.tar.zst (Arch) for `mise run linux:package`, which sets ARCH (amd64 / arm64),
# VERSION and PKG_DIR: /opt/recur, /usr/bin/recur and the
# build.recur.app menu entry.
# PGP-signed when RECUR_PGP_KEY names an armored private key file (passphrase
# in NFPM_PASSPHRASE); otherwise unsigned.
name: recur
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: recur.build
vendor: recur.build
homepage: https://recur.build
license: Elastic-2.0
description: Run autonomous AI coding loops locally (Rust/GPUI app).
section: devel

# The app links nothing onto PATH or into the menu when run from
# /opt/recur (identity::LINUX_PACKAGED_DIR): the package owns those.
contents:
  - src: ${PKG_DIR}/recur
    dst: /opt/recur/recur
    expand: true
  - src: ${PKG_DIR}/recur-cli
    dst: /opt/recur/recur-cli
    expand: true
  - src: ${PKG_DIR}/recur.png
    dst: /opt/recur/recur.png
    expand: true
  - src: /opt/recur/recur-cli
    dst: /usr/bin/recur
    type: symlink
  - src: build/linux/build.recur.app.desktop
    dst: /usr/share/applications/build.recur.app.desktop

# GTK 4 and WebKitGTK 6.0 for the HTML preview, GStreamer and its decoders for video
# (WebKitGTK plays <video> through the same; -bad carries dav1d for AV1); xkbcommon and xcb for GPUI's
# X11 backend. GPUI loads Wayland and Vulkan at runtime. The HTTP client reads
# the system CA store at startup.
depends:
  - ca-certificates
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-libav
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb1
  - libwayland-client0
  - libvulkan1
# secret-tool keeps API keys in the Secret Service keyring (else a 0600 file).
recommends:
  - libsecret-tools
overrides:
  rpm:
    recommends:
      - libsecret
    depends:
      - ca-certificates
      - gtk4
      - webkitgtk6.0
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-libav
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - vulkan-loader
  archlinux:
    recommends:
      - libsecret
    depends:
      - ca-certificates
      - gtk4
      - webkitgtk-6.0
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad
      - gst-libav
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - wayland
      - vulkan-icd-loader

deb:
  signature:
    key_file: ${RECUR_PGP_KEY}
rpm:
  signature:
    key_file: ${RECUR_PGP_KEY}

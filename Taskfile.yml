version: '3'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "recur"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Desktop app is {{.BIN_DIR}}/{{.APP_NAME}}; CLI is a separate binary.
  CLI_BIN: '{{.BIN_DIR}}/recur-cli'
  VERSION:
    sh: |
      if [ -n "$RECUR_VERSION" ]; then echo "$RECUR_VERSION"; exit; fi
      if tag=$(git describe --tags --match 'v[0-9]*' --exact-match 2>/dev/null); then echo "${tag#v}"; exit; fi
      tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
      v=${tag#v}
      echo "${v:-0.0.0}+commit.$(git rev-parse --short=8 HEAD)"
  CLI_LDFLAGS: '-X recur/internal/cli.Version={{.VERSION}}'
  # Release builds set RECUR_UPDATE_URL to turn on the in-app updater (updater.go).
  APP_LDFLAGS: '-X main.version={{.VERSION}} -X main.updateManifestURL={{.RECUR_UPDATE_URL}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  build:cli:
    summary: Builds the Recur CLI (authoring tools) to {{.CLI_BIN}}
    sources:
      - cmd/recur/**/*.go
      - internal/cli/**/*
      - internal/bundles/**/*
      - go.mod
      - go.sum
    generates:
      - '{{.CLI_BIN}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags="{{.CLI_LDFLAGS}}" -o {{.CLI_BIN}} ./cmd/recur

  package:
    summary: Packages a production build (RECUR_DEBUG=1 keeps the web inspector and skips frontend minify)
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:go:
    summary: Runs Go unit tests
    cmds:
      - go test ./...
    # Match production Darwin min version (build/darwin/Taskfile.yml).
    # Setting CGO_* replaces Go's defaults, so keep `-O2 -g` and append the pin.
    env: &darwin_cgo_env
      CGO_CFLAGS: '{{if eq OS "darwin"}}-O2 -g -mmacosx-version-min=12.0{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-O2 -g -mmacosx-version-min=12.0{{end}}'
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}12.0{{end}}'

  test:go:race:
    summary: Runs Go unit tests with the race detector (slow; CI runs it)
    cmds:
      - go test -race -timeout 30m ./...
    env: *darwin_cgo_env

  lint:go:
    summary: go vet, gofmt, and staticcheck
    cmds:
      - go vet ./...
      - |
        out=$(git ls-files '*.go' | xargs gofmt -l)
        if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
    env: *darwin_cgo_env

  lint:frontend:
    summary: Typechecks the frontend (svelte-check)
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - pnpm run check

  check:vulns:
    summary: Reports known vulnerabilities reachable from Recur's Go code (network)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
    env: *darwin_cgo_env

  test:bundles:
    summary: Runs shipped Recur Bundle engine tests (needs node on PATH)
    deps:
      - build:cli
    cmds:
      - '{{.CLI_BIN}} bundles test ./bundles'

  lint:bundles:
    summary: Lints shipped Recur Bundles (schema, TS compile, shebang, keybindings)
    deps:
      - build:cli
    cmds:
      - '{{.CLI_BIN}} bundles lint ./bundles'

  fetch:tm-grammars:
    summary: Re-fetch TextMate grammars from shikijs/textmate-grammars-themes into bundles/Languages
    cmds:
      - node scripts/fetch-tm-grammars.mjs

  fetch:tm-themes:
    summary: Re-fetch pack TextMate themes from shikijs/tm-themes (+ Aura) into bundles/Themes
    cmds:
      - node scripts/fetch-tm-themes.mjs

  port:filmgirl-themes:
    summary: Convert filmgirl TextMate plists into local theme ports (skips mods; does not fetch Shiki)
    cmds:
      - node scripts/port-filmgirl-themes.mjs
      - node scripts/fetch-tm-themes.mjs --local-only

  build:rust:
    summary: Builds the Rust/GPUI port (rust/target; never touches bin/)
    dir: rust
    cmds:
      - cargo build {{.CLI_ARGS}}

  run:rust:
    summary: Runs the Rust/GPUI desktop app on the engine-backed services (data dir defaults to RecurNext; `-- --features mock` for the mock bridge)
    dir: rust
    cmds:
      - cargo run -p recur-desktop {{.CLI_ARGS}}

  lint:rust:
    summary: rustfmt check, clippy and the crate layering check for the Rust port
    dir: rust
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test -p recur-layering

  test:rust:
    summary: Runs the Rust port's tests
    dir: rust
    cmds:
      - cargo test --workspace

  package:rust:
    summary: Packages the Rust port as rust/target/package/Recur Next.app, .dmg and updater .zip (macOS; UNIVERSAL=true, SIGN_IDENTITY / KEYCHAIN_PROFILE / RECUR_SIGN_IDENTITY as darwin:sign, RECUR_NEXT_UPDATE_URL turns on the updater; see rust/build/darwin/package.sh)
    platforms: [darwin]
    deps:
      - task: common:generate:icons
      - task: common:generate:help-skill
    cmds:
      - rust/build/darwin/package.sh
    env:
      VERSION: '{{.VERSION}}'

  linux:test:rust:
    summary: rustfmt, clippy and the Rust port's tests on Linux (natively on Linux, in rust/build/linux/Dockerfile elsewhere; WebKitGTK tests under xvfb-run)
    cmds:
      - rust/build/linux/in-docker.sh sh -c 'cargo fmt --all --check && cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && xvfb-run -a cargo test --workspace --all-features --locked'
    env:
      ARCH: '{{.ARCH | default ARCH}}'

  linux:build:rust:
    summary: Release Linux build of the Rust port into rust/target/package/recur-next-linux-<arch> (recur, recur-cli, recur.png; in Docker on non-Linux hosts, see rust/build/linux/in-docker.sh)
    deps:
      - task: common:generate:help-skill
    cmds:
      - rust/build/linux/in-docker.sh build/linux/build.sh
    env:
      ARCH: '{{.ARCH | default ARCH}}'
      VERSION: '{{.VERSION}}'

  linux:package:rust:
    summary: Packages rust/target/package/recur-next-linux-<arch>.tar.gz, .deb and .rpm (install to /opt/recur-next with /usr/bin/recur-next and the build.recur.next menu entry, beside the Go app's packages)
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      PKG: 'recur-next-linux-{{.TARGET_ARCH}}'
    cmds:
      - task: linux:build:rust
        vars:
          ARCH: '{{.TARGET_ARCH}}'
      - tar --no-xattrs -C rust/target/package -czf "rust/target/package/{{.PKG}}.tar.gz" "{{.PKG}}"
      - for: [deb, rpm]
        cmd: GOARCH={{.TARGET_ARCH}} RECUR_VERSION={{.VERSION}} PKG_DIR="rust/target/package/{{.PKG}}" wails3 tool package -name "{{.PKG}}" -format {{.ITEM}} -config rust/build/linux/nfpm.yaml -out rust/target/package

  linux:run:rust:
    summary: Builds the Rust port for Linux and runs it (natively on Linux; elsewhere on a Docker desktop at http://127.0.0.1:6081 via noVNC, see rust/build/linux/run-desktop.sh)
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - task: linux:build:rust
        vars:
          ARCH: '{{.TARGET_ARCH}}'
      - '{{if eq OS "linux"}}rust/target/package/recur-next-linux-{{.TARGET_ARCH}}/recur{{else}}rust/build/linux/run-desktop.sh{{end}}'
    env:
      ARCH: '{{.TARGET_ARCH}}'

  linux:smoke:rust:
    summary: Installs the linux:package:rust .deb and tarball in a clean Debian 13 container and checks paths, the recur-next link, the menu entry, `recur-next .` and a notification (see rust/build/linux/smoke.sh)
    cmds:
      - rust/build/linux/smoke.sh
    env:
      ARCH: '{{.ARCH | default ARCH}}'

  smoke:package:rust:
    summary: Installs rust/target/package/Recur Next.dmg into a sandbox, launches it, and checks the recur-next link, `recur-next .` and a native notification (macOS; see rust/build/darwin/smoke.sh)
    platforms: [darwin]
    cmds:
      - rust/build/darwin/smoke.sh

  smoke:rust:
    summary: Boots the Rust desktop on a sandbox built from a Recur data dir (read only) and drives every view; `wails3 task smoke:rust DATA="<data dir>" [SANDBOX=<dir>]` (see rust/crates/desktop/examples/real_data_smoke.rs)
    dir: rust
    cmds:
      - cargo run -p recur-desktop --example real_data_smoke -- "{{.DATA}}" {{.SANDBOX}}

  test:rust:ui-parity:
    summary: Captures WebKit references of the recur-ui scenes from the Svelte UI and diffs the Rust renders against them (macOS; see rust/docs/ui-parity.md)
    dir: rust/tools/ui-parity
    deps:
      - task: common:install:frontend:deps
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm exec playwright install webkit
      - pnpm exec playwright test
      - cargo run -p recur-ui-parity -- check {{.CLI_ARGS}}

  test:frontend:
    summary: Runs frontend Vitest unit tests
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - pnpm test

  test:e2e:
    summary: Runs frontend Playwright e2e tests
    dir: frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - pnpm run e2e

  test:splash:
    summary: Builds the splash page and checks the real interactive app demo
    deps:
      - task: common:install:frontend:deps
    cmds:
      - npm --prefix src-web ci --ignore-scripts
      - npm --prefix src-web run build
      - node scripts/check-splash.mjs

  capture:splash:
    summary: Captures the app using the product dataset and named screen presets
    deps:
      - task: common:install:frontend:deps
    cmds:
      - cd frontend && pnpm exec vite build --config showcase/vite.config.ts
      - node scripts/capture-splash.mjs {{.CLI_ARGS}}

  test:
    summary: Runs all automated tests (Go, lints, bundles, frontend unit + e2e)
    cmds:
      - task: test:go
      - task: lint:go
      - task: lint:frontend
      - task: lint:bundles
      - task: test:bundles
      - task: test:frontend
      - task: test:e2e

  check:
    summary: Fast quality gate (Go tests, Go/frontend lint, bundle lint/test, frontend unit; no Playwright)
    cmds:
      - task: test:go
      - task: lint:go
      - task: lint:frontend
      - task: lint:bundles
      - task: test:bundles
      - task: test:frontend

  check:cursor-sdk-pin:
    summary: Fail if PyPI cursor-sdk is ahead of pinnedSDKVersion (network; flags re-pin)
    cmds:
      - RECUR_CURSOR_SDK_PIN_CHECK=1 go test ./internal/cursor -run CheckCursorSDKPinDrift -count=1

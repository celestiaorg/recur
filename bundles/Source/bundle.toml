[bundle]
name = "Source"
id = "recur.source"
version = "1.0.0"
author = "Recur"

[[command]]
id = "recur.source.spaces-to-tabs"
name = "Convert Spaces to Tabs"
category = "Source"
order = 10
input = "selection"
fallbackInput = "document"
output = "replaceInput"
triggers = ["palette"]
keyEquivalent = "ctrl+shift+tab"
interpreter = "typescript"
script = "src/spaces-to-tabs.ts"


[package]
name = "recur-ui"
description = "Recur's design system on GPUI: theme tokens, fonts, icons, and shared widgets matching the web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Widget gallery scenes for `examples/gallery.rs`.
gallery = []

[dependencies]
gpui-kit.workspace = true
fancy-regex.workspace = true
include_dir.workspace = true
wuff.workspace = true
ttf-parser.workspace = true
unicode-linebreak.workspace = true
resvg.workspace = true
smallvec.workspace = true
base64.workspace = true
image = { workspace = true, features = ["png"] }
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
chrono.workspace = true

# WebKit paints SVG and text through CoreGraphics / CoreText; so does recur-ui on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
core-text.workspace = true
core-foundation.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true
futures.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
yeslogic-fontconfig-sys.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
recur-ui = { path = ".", features = ["gallery"] }

[lints]
workspace = true

[[test]]
name = "fonts"
harness = false

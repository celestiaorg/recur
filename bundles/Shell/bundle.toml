[bundle]
name = "Shell"
id = "recur.shell"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "bash-language-server"
languages = ["shellscript", "shell", "bash"]
fileGlob = ["*.sh", "*.bash", "*.zsh"]
command = "bash-language-server"
args = ["start"]
managed = "bash-language-server"

[[command]]
id = "recur.shell.shfmt-on-save"
name = "Shfmt on Save"
category = "Shell"
order = 10
scope = "source.shell"
fileGlob = "*.{sh,bash,zsh}"
input = "document"
output = "replaceDocument"
triggers = ["willSave"]
interpreter = "shebang"
body = '''
#!/usr/bin/env bash
# Format stdin with shfmt; pass through unchanged if missing/failing.
if ! command -v shfmt >/dev/null 2>&1; then
  cat
  exit 0
fi
tmp=$(mktemp)
trap 'rm -f "$tmp" "$tmp.out"' EXIT
cat >"$tmp"
if shfmt "$tmp" >"$tmp.out" 2>/dev/null; then
  cat "$tmp.out"
else
  cat "$tmp"
fi
'''

[[command]]
id = "recur.shell.execute"
name = "Execute Selection"
category = "Shell"
order = 20
scope = "source.shell"
fileGlob = "*.{sh,bash,zsh}"
input = "selection"
fallbackInput = "line"
output = "replaceInput"
triggers = ["palette"]
interpreter = "shebang"
script = "bin/execute.sh"

[[command]]
id = "recur.shell.execute-keep"
name = "Execute and Keep"
category = "Shell"
order = 21
scope = "source.shell"
fileGlob = "*.{sh,bash,zsh}"
input = "selection"
fallbackInput = "line"
output = "replaceInput"
triggers = ["palette"]
interpreter = "shebang"
script = "bin/execute-keep.sh"

[[command]]
id = "recur.shell.validate"
name = "Validate Syntax"
category = "Shell"
order = 22
scope = "source.shell"
fileGlob = "*.{sh,bash,zsh}"
input = "selection"
fallbackInput = "document"
output = "showAsToast"
triggers = ["palette"]
interpreter = "shebang"
script = "bin/validate.sh"

[[command]]
id = "recur.shell.make-executable"
name = "Make Executable"
category = "Shell"
order = 23
scope = "source.shell"
fileGlob = "*.{sh,bash,zsh}"
input = "none"
output = "showAsToast"
triggers = ["palette"]
interpreter = "shebang"
script = "bin/make-executable.sh"


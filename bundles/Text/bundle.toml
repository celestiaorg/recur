[bundle]
name = "Text"
id = "recur.text"
version = "1.0.0"
author = "Recur"

# Interpreters: typescript (esbuild → Worker) or shebang (OS subprocess).
# These commands are the reference for authoring your own bundles — copy a
# src/*.ts file or a shebang body and adapt.
# Typescript macros import from @recur/sdk (see bundles/sdk/index.ts).

# --- typescript via script= (preferred for real macros) ---------------------


name: Setup
description: Go (go.mod toolchain), pnpm + Node, and optionally the wails3 CLI.

inputs:
  go:
    description: Install Go
    default: "true"
  node:
    description: Install pnpm and Node
    default: "true"
  wails:
    description: Install wails3 at the go.mod version (needs go)
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - if: inputs.node == 'true'
      uses: pnpm/action-setup@v6
      with:
        package_json_file: frontend/package.json

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - if: inputs.wails == 'true'
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)

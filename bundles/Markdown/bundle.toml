[bundle]
name = "Markdown"
id = "recur.markdown"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "marksman"
languages = ["markdown"]
fileGlob = ["*.md", "*.markdown", "*.mdx"]
command = "marksman"
args = ["server"]
managed = "marksman"

[[command]]
id = "recur.markdown.hard-break"
name = "Hard Linebreak"
category = "Markdown"
order = 5
scope = "text.html.markdown"
fileGlob = "*.{md,markdown,mdown,mdx}"
input = "none"
output = "insertText"
triggers = ["palette"]
keyEquivalent = "ctrl+enter"
interpreter = "typescript"
script = "src/hard-break.ts"

[[command]]
id = "recur.markdown.bold"
name = "Bold"
category = "Markdown"
order = 10
scope = "text.html.markdown"
fileGlob = "*.{md,markdown,mdown,mdx}"
input = "selection"
fallbackInput = "word"
output = "replaceInput"
triggers = ["palette"]
interpreter = "typescript"
script = "src/bold.ts"

[[command]]
id = "recur.markdown.italic"
name = "Italic"
category = "Markdown"
order = 11
scope = "text.html.markdown"
fileGlob = "*.{md,markdown,mdown,mdx}"
input = "selection"

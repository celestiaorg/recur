[bundle]
name = "Terminal"
id = "recur.terminal"
version = "1.0.0"
author = "Recur"

# xterm.js ITheme palettes (https://xtermjs.org/docs/api/terminal/interfaces/itheme/).
# Classic consoles, then retro machines, then popular iTerm staples.

[[terminalTheme]]
id = "vga"
name = "VGA"
path = "themes/vga.json"
uiTheme = "dark"
order = 10


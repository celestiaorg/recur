name: Release

# Pushing a vX.Y.Z tag builds a universal Recur.app (stamping X.Y.Z into
# Info.plist) in a styled DMG, and the Linux tarballs, .debs and .rpms, in
# parallel. Only once every build succeeds does `publish` create the GitHub
# release and attach them all with a SHA256SUMS, so a failed build never leaves
# a partial release.
#
# With all the secrets below Recur.app and the DMG are Developer ID signed,
# notarized, and stapled. With only the MACOS_* ones they are signed but not
# notarized, which still keeps users' macOS folder permissions across updates.
# With none it ships ad-hoc signed. Unless notarized, users clear quarantine per
# README "Installing".
#
# Signing secrets:
#   MACOS_CERT_P12_BASE64  code-signing cert + key, `base64 -i cert.p12`
#   MACOS_CERT_PASSWORD    password for that .p12
#   MACOS_SIGN_IDENTITY    cert common name, defaults to "Developer ID Application"
#   APPLE_ID               Apple ID email used for notarization
#   APPLE_TEAM_ID          10-character team ID
#   APPLE_APP_PASSWORD     app-specific password for APPLE_ID
#
# With LINUX_PGP_KEY the .deb and .rpm are PGP-signed (nfpm, at package time);
# without it they ship unsigned.
#   LINUX_PGP_KEY          armored private key, `gpg --armor --export-secret-keys <id>`
#   LINUX_PGP_PASSPHRASE   its passphrase, if any
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || 'Developer ID Application' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          wails: "true"

      - name: Import signing certificate and notary credentials
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC"
          security default-keychain -s "$KC"
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool store-credentials recur-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
              --keychain "$KC"
          fi

      # The temp keychain holds exactly one identity, so the common-name prefix
      # is enough for codesign to select it.
      - name: Build, sign, notarize
        if: env.HAS_NOTARY == 'true'
        run: |
          RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task darwin:sign:notarize UNIVERSAL=true \
            SIGN_IDENTITY="$SIGN_IDENTITY" KEYCHAIN_PROFILE=recur-notary

      - name: Build, sign
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY != 'true'
        run: RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task darwin:sign UNIVERSAL=true SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Build (ad-hoc signed)
        if: env.HAS_SIGNING != 'true'
        run: RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task darwin:package:universal

      - name: Verify
        run: |
          codesign --verify --deep --strict bin/Recur.app
          if [ "$HAS_NOTARY" = true ]; then spctl --assess --type execute bin/Recur.app; fi
          plutil -extract CFBundleShortVersionString raw bin/Recur.app/Contents/Info.plist
          for bin in recur recur-cli; do lipo bin/Recur.app/Contents/MacOS/$bin -verify_arch arm64 x86_64; done

      # Notarizing the DMG as well as the app lets Gatekeeper pass the
      # download offline once the ticket is stapled.
      - name: DMG
        run: |
          DMG="bin/Recur-${GITHUB_REF_NAME#v}-macos-universal.dmg"
          wails3 task darwin:create:dmg
          mv bin/Recur.dmg "$DMG"
          if [ "$HAS_SIGNING" = true ]; then codesign --sign "$SIGN_IDENTITY" --timestamp "$DMG"; fi
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool submit "$DMG" --keychain-profile recur-notary --wait
            xcrun stapler staple "$DMG"
            spctl --assess --type open --context context:primary-signature "$DMG"
          fi
          hdiutil verify "$DMG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: bin/Recur-*-macos-universal.dmg
          if-no-files-found: error

  # Each arch builds natively (the app is cgo + GTK), so arm64 needs an arm runner.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HAS_PGP: ${{ secrets.LINUX_PGP_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: ./.github/actions/setup
        with:
          wails: "true"
      - name: Write PGP signing key
        if: env.HAS_PGP == 'true'
        env:
          LINUX_PGP_KEY: ${{ secrets.LINUX_PGP_KEY }}
        run: |
          printf '%s\n' "$LINUX_PGP_KEY" > "$RUNNER_TEMP/pgp.asc"
          echo "RECUR_PGP_KEY=$RUNNER_TEMP/pgp.asc" >> "$GITHUB_ENV"
      - env:
          NFPM_PASSPHRASE: ${{ secrets.LINUX_PGP_PASSPHRASE }}
        run: RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task linux:package
      - run: |
          for ext in tar.gz deb rpm; do
            mv "bin/recur-linux-${{ matrix.arch }}.$ext" "bin/Recur-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.$ext"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: bin/Recur-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

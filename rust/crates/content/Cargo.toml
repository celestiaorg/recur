[package]
name = "recur-content"
description = "Rich content views: markdown, Mermaid, PDF, file previews and the image lightbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Parity scenes for `rust/tools/ui-parity` (`gallery::build`).
gallery = ["recur-ui/gallery"]

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-textmate.workspace = true
regress.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
base64.workspace = true
smallvec.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
resvg = { workspace = true, features = ["text", "system-fonts", "memmap-fonts"] }
recur-editor.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
core-foundation.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-av-foundation = { workspace = true, features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-web-kit.workspace = true
block2.workspace = true
raw-window-handle.workspace = true
include_dir.workspace = true

# WebM and Ogg (`video::webm`). The codec crates ship static libraries for Apple silicon only.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
matroska-demuxer.workspace = true
ogg.workspace = true
lewton.workspace = true
theora-rs.workspace = true
shiguredo_libvpx.workspace = true
shiguredo_aom.workspace = true
shiguredo_opus.workspace = true
cpal.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
webkit6.workspace = true
gtk4.workspace = true
include_dir.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
gpui = { workspace = true, features = ["test-support"] }
recur-content = { path = ".", features = ["gallery"] }

# Mermaid and pdf.js in the platform WebKit; on its own main thread for WKWebView.
[[test]]
name = "webkit"
harness = false

# AVFoundation needs the main thread and its run loop.
[[test]]
name = "video"
harness = false

[lints]
workspace = true

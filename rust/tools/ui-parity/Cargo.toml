[package]
name = "recur-ui-parity"
description = "Renders recur-ui gallery scenes headlessly and diffs them against the Svelte reference captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ui-parity"
path = "src/main.rs"

[dependencies]
recur-ui = { workspace = true, features = ["gallery"] }
recur-editor = { workspace = true, features = ["gallery"] }
recur-terminal-view = { workspace = true, features = ["gallery"] }
recur-content = { workspace = true, features = ["gallery"] }
recur-app = { workspace = true, features = ["gallery"] }
recur-view-core = { workspace = true, features = ["gallery"] }
recur-view-chat = { workspace = true, features = ["gallery"] }
recur-view-review = { workspace = true, features = ["gallery"] }
recur-view-observatory = { workspace = true, features = ["gallery"] }
recur-view-workspace = { workspace = true, features = ["gallery"] }
recur-view-prs = { workspace = true, features = ["gallery"] }
recur-view-settings = { workspace = true, features = ["gallery"] }
recur-view-home = { workspace = true, features = ["gallery"] }
recur-view-briefing = { workspace = true, features = ["gallery"] }
recur-view-projects = { workspace = true, features = ["gallery"] }
recur-view-palettes = { workspace = true, features = ["gallery"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[bundle]
name = "Go"
id = "recur.go"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "gopls"
languages = ["go", "go.mod", "go.work", "go.sum", "gomod", "gowork"]
fileGlob = ["*.go", "go.mod", "go.work", "go.sum"]
command = "gopls"
args = ["serve"]
managed = "gopls"

[[command]]
id = "recur.go.gofmt-on-save"
name = "Gofmt on Save"
category = "Go"
order = 10
scope = "source.go"
fileGlob = "*.go"
input = "document"
output = "replaceDocument"
triggers = ["willSave"]
interpreter = "shebang"
body = '''
#!/usr/bin/env bash
# Format stdin with gofmt; pass through unchanged if gofmt is missing.
# Write via a file (not $(…)) so trailing newlines are preserved.
if ! command -v gofmt >/dev/null 2>&1; then
  cat
  exit 0
fi
tmp=$(mktemp)
trap 'rm -f "$tmp" "$tmp.out"' EXIT
cat >"$tmp"
if gofmt "$tmp" >"$tmp.out" 2>/dev/null; then
  cat "$tmp.out"
else
  cat "$tmp"
fi
'''


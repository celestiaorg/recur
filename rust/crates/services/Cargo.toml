[package]
name = "recur-services"
description = "Application services: the UI-facing API over the engine (the former Wails-bound services) plus typed app events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# In-memory port of frontend/e2e/helpers/mock-bridge.ts for dev builds, tests
# and the UI-parity harness.
mock = ["dep:futures", "dep:regex", "dep:uuid"]

[dependencies]
recur-provider-claude.workspace = true
recur-provider-codex.workspace = true
recur-provider-cursor.workspace = true
recur-provider-compatible.workspace = true
recur-forge.workspace = true
recur-issues.workspace = true
recur-agent.workspace = true
recur-domain.workspace = true
recur-store.workspace = true
recur-engine.workspace = true
recur-bundles.workspace = true
recur-code.workspace = true
recur-git.workspace = true
recur-lsp.workspace = true
recur-term.workspace = true
recur-usage.workspace = true
recur-platform.workspace = true
async-trait.workspace = true
base64.workspace = true
futures = { workspace = true, optional = true }
parking_lot.workspace = true
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
pretty_assertions.workspace = true
tokio.workspace = true

[lints]
workspace = true

name: CLA

# Asks first-time contributors to sign CLA.md by commenting on their PR, and
# records signatures on the cla-signatures branch (kept off main so branch
# protection does not block the bot's commits). pull_request_target gives the
# action a write token; it never checks out PR code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Org members and repo collaborators skip the job; a skipped required
    # check counts as passing.
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.pull_request.author_association || github.event.issue.author_association) && (
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      # v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/celestiaorg/recur/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: "*[bot]"

[package]
name = "recur-view-briefing"
description = "The list views of the briefing family: the Inbox (Briefing with Ask Recur), Issues and Schedules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Parity scenes for `rust/tools/ui-parity` (`gallery::build`).
gallery = [
    "recur-services/mock",
    "recur-ui/gallery",
    "recur-content/gallery",
    "recur-view-chat/gallery",
    "recur-view-prs/gallery",
    "dep:recur-app",
    "dep:recur-view-review",
    "dep:recur-view-observatory",
    "dep:recur-view-workspace",
    "dep:recur-view-settings",
    "dep:recur-view-home",
    "dep:serde",
]

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-content.workspace = true
recur-services.workspace = true
recur-domain.workspace = true
recur-engine.workspace = true
recur-view-core.workspace = true
recur-view-chat.workspace = true
recur-view-prs.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
recur-app = { workspace = true, features = ["gallery"], optional = true }
recur-view-review = { workspace = true, features = ["gallery"], optional = true }
recur-view-observatory = { workspace = true, features = ["gallery"], optional = true }
recur-view-workspace = { workspace = true, features = ["gallery"], optional = true }
recur-view-settings = { workspace = true, features = ["gallery"], optional = true }
recur-view-home = { workspace = true, features = ["gallery"], optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
futures.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
recur-services = { workspace = true, features = ["mock"] }
recur-view-briefing = { path = ".", features = ["gallery"] }
recur-app = { workspace = true, features = ["gallery"] }
parking_lot.workspace = true

[lints]
workspace = true

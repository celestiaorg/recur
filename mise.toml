# Tools for Recur; tasks live in tasks/*.toml. `mise install` once, then
# `mise run <task>` (`mise tasks` lists them). Rust itself comes from
# rust-toolchain.toml.

[tools]
node = "22.23.4"
pnpm = "10.34.3"
nfpm = "2.48.0"
# uv lets mise install dmgbuild (macOS DMG layout) without a system Python.
uv = "0.13.6"
"pipx:dmgbuild" = { version = "1.6.7", os = ["macos"] }

[task_config]
includes = ["tasks/*.toml"]

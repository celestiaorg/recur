# .deb / .rpm for `wails3 task linux:package:rust`, which sets GOARCH,
# RECUR_VERSION and PKG_DIR. Side by side with build/linux/nfpm.yaml's `recur`
# package: its own name, /opt/recur-next, /usr/bin/recur-next and desktop id.
# PGP-signed when RECUR_PGP_KEY names an armored private key file (passphrase
# in NFPM_PASSPHRASE); otherwise unsigned.
name: recur-next
arch: ${GOARCH}
platform: linux
version: ${RECUR_VERSION}
maintainer: recur.build
vendor: recur.build
homepage: https://recur.build
description: Run autonomous AI coding loops locally (Rust/GPUI app).
section: devel

# The app links nothing onto PATH or into the menu when run from
# /opt/recur-next (identity::LINUX_PACKAGED_DIR): the package owns those.
contents:
  - src: ${PKG_DIR}/recur
    dst: /opt/recur-next/recur
    expand: true
  - src: ${PKG_DIR}/recur-cli
    dst: /opt/recur-next/recur-cli
    expand: true
  - src: ${PKG_DIR}/recur.png
    dst: /opt/recur-next/recur.png
    expand: true
  - src: /opt/recur-next/recur-cli
    dst: /usr/bin/recur-next
    type: symlink
  - src: rust/build/linux/build.recur.next.desktop
    dst: /usr/share/applications/build.recur.next.desktop

# GTK 4 and WebKitGTK 6.0 for Mermaid and PDF, GStreamer and its decoders for video
# (WebKitGTK plays <video> through the same; -bad carries dav1d for AV1); xkbcommon and xcb for GPUI's
# X11 backend. GPUI loads Wayland and Vulkan at runtime. The HTTP client reads
# the system CA store at startup.
depends:
  - ca-certificates
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-libav
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb1
  - libwayland-client0
  - libvulkan1
overrides:
  rpm:
    depends:
      - ca-certificates
      - gtk4
      - webkitgtk6.0
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-libav
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - vulkan-loader

deb:
  signature:
    key_file: ${RECUR_PGP_KEY}
rpm:
  signature:
    key_file: ${RECUR_PGP_KEY}

name: Release

# Pushing a vX.Y.Z tag builds Recur.app, stamps X.Y.Z into Info.plist, and
# attaches the zip to the GitHub release. With the secrets below it is
# Developer ID signed and notarized; without them it ships ad-hoc signed
# (users clear quarantine per README "Installing").
#
# Signing secrets:
#   MACOS_CERT_P12_BASE64  Developer ID Application cert + key, `base64 -i cert.p12`
#   MACOS_CERT_PASSWORD    password for that .p12
#   APPLE_ID               Apple ID email used for notarization
#   APPLE_TEAM_ID          10-character team ID
#   APPLE_APP_PASSWORD     app-specific password for APPLE_ID
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          wails: "true"

      - name: Import signing certificate and notary credentials
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC"
          security default-keychain -s "$KC"
          xcrun notarytool store-credentials recur-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$KC"

      # The temp keychain holds exactly one Developer ID identity, so the
      # common-name prefix is enough for codesign to select it.
      - name: Build, sign, notarize
        if: env.HAS_SIGNING == 'true'
        run: |
          RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task darwin:sign:notarize \
            SIGN_IDENTITY="Developer ID Application" KEYCHAIN_PROFILE=recur-notary

      - name: Build (ad-hoc signed)
        if: env.HAS_SIGNING != 'true'
        run: RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task package

      - name: Verify
        run: |
          codesign --verify --deep --strict bin/Recur.app
          if [ "$HAS_SIGNING" = true ]; then spctl --assess --type execute bin/Recur.app; fi
          plutil -extract CFBundleShortVersionString raw bin/Recur.app/Contents/Info.plist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="bin/Recur-${GITHUB_REF_NAME#v}-macos-arm64.zip"
          ditto -c -k --keepParent bin/Recur.app "$ZIP"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  # Runs after `release` so the GitHub release already exists. Each arch builds
  # natively (the app is cgo + GTK), so arm64 needs an arm runner.
  release-linux:
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          wails: "true"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: RECUR_VERSION="${GITHUB_REF_NAME#v}" wails3 task linux:package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TGZ="bin/Recur-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"
          mv bin/recur-linux-${{ matrix.arch }}.tar.gz "$TGZ"
          gh release upload "$GITHUB_REF_NAME" "$TGZ" --clobber

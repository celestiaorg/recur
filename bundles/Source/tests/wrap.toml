[[test]]
name = "wraps braces"
command = "Wrap / Unwrap Braces"

[test.context]
input = "foo"
selectedText = "foo"

[test.expect]
stdout = "{foo}"
output = "replaceSelection"

[[test]]
name = "unwraps braces"
command = "Wrap / Unwrap Braces"

[test.context]
input = "{foo}"
selectedText = "{foo}"

[test.expect]
stdout = "foo"
output = "replaceSelection"


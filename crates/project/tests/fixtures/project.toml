# Recur project settings — fixture for Overlay testdata.

setup_cmd = """
# install deps
go mod download
wails3 task common:install:frontend:deps
"""

teardown_cmd = 'rm -rf "$HOME/Library/Application Support/Recur-$RECUR_WORKSPACE_ID"'
app_url = ""

env = """
RECUR_DATA_DIR=$HOME/Library/Application Support/Recur-$RECUR_WORKSPACE_ID
WAILS_VITE_PORT=$RECUR_PORT
RECUR_INSTANCE_LABEL=$RECUR_BRANCH
"""

[[run]]
name = "dev"
cmd = "wails3 task dev"

[[run]]
name = "test:go"
cmd = "wails3 task test:go"

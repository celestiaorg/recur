name: CI

# Branch protection requires only the "CI success" job. To add a check, add a
# job here and list it under ci-success.needs; no GitHub settings change.
#
# Go jobs run on macos-26: the app is cgo + WebKit, and `wails3 generate icons`
# compiles build/appicon.icon with actool, which needs Xcode 26+. Jobs that
# only need Node or the pure-Go CLI run on Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: "false"
          wails: "true"
      - run: wails3 task test:go

  go-race:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: "false"
          wails: "true"
      - run: wails3 task test:go:race

  go-lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node: "false"
          wails: "true"
      - run: wails3 task lint:go
      - run: wails3 task check:vulns

  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: go build -o bin/recur-cli ./cmd/recur
      - run: bin/recur-cli bundles lint ./bundles
      - run: bin/recur-cli bundles test ./bundles

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test

  # Playwright drives the real Svelte UI in headless Chromium against a mocked
  # Wails bridge (frontend/e2e/helpers/mock-bridge.ts) seeded from the committed
  # fixture, so it needs no Go backend, no `claude`, and no native window.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # Ad-hoc signed arm64 Recur.app. Also fails if the build regenerates
  # committed Wails bindings or go.mod/go.sum (someone forgot to commit them).
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          wails: "true"
      - run: wails3 task package
      - name: Committed bindings and go.mod are current
        run: |
          drift=$(git status --porcelain -- frontend/bindings go.mod go.sum)
          if [ -n "$drift" ]; then echo "$drift"; git diff -- frontend/bindings go.mod go.sum; exit 1; fi
      - run: ditto -c -k --keepParent bin/Recur.app bin/Recur-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Recur-macos-arm64
          path: bin/Recur-macos-arm64.zip
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [go-test, go-race, go-lint, bundles, frontend, e2e, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

[package]
name = "recur-view-home"
description = "The first-run path and creation flows: Welcome, New workspace, New project and the schedule editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Gallery scenes (`gallery::build`, listed in `crates/ui/gallery/scenes.json`).
gallery = [
    "recur-services/mock",
    "recur-view-core/gallery",
    "recur-ui/gallery",
    "recur-content/gallery",
    "recur-view-chat/gallery",
    "dep:serde",
]

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-content.workspace = true
recur-services.workspace = true
recur-domain.workspace = true
recur-engine.workspace = true
recur-bundles.workspace = true
recur-view-core.workspace = true
recur-view-chat.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
futures.workspace = true
icu_time.workspace = true
iana-time-zone.workspace = true
image = { workspace = true, features = ["png"] }
smallvec.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true

[dev-dependencies]
recur-view-review = { workspace = true, features = ["gallery"] }
recur-view-observatory = { workspace = true, features = ["gallery"] }
recur-view-workspace = { workspace = true, features = ["gallery"] }
recur-view-prs = { workspace = true, features = ["gallery"] }
recur-view-settings = { workspace = true, features = ["gallery"] }
gpui = { workspace = true, features = ["test-support"] }
recur-services = { workspace = true, features = ["mock"] }
recur-view-home = { path = ".", features = ["gallery"] }
recur-app = { workspace = true, features = ["gallery"] }
parking_lot.workspace = true

[lints]
workspace = true

[package]
name = "recur-desktop"
description = "Recur desktop app entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "recur"
path = "src/main.rs"

[features]
# Runs the UI on the e2e mock bridge instead of the engine-backed services.
mock = ["recur-services/mock"]

[dependencies]
recur-app.workspace = true
recur-bundles.workspace = true
recur-code.workspace = true
recur-domain.workspace = true
recur-platform.workspace = true
recur-services.workspace = true
recur-store.workspace = true
recur-ui.workspace = true
recur-view-core.workspace = true
recur-view-chat.workspace = true
recur-view-review.workspace = true
recur-view-observatory.workspace = true
recur-view-workspace.workspace = true
recur-view-prs.workspace = true
recur-view-settings.workspace = true
recur-view-home.workspace = true
recur-view-briefing.workspace = true
recur-view-projects.workspace = true
recur-view-palettes.workspace = true
gpui-kit.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
flate2.workspace = true
recur-agent.workspace = true
recur-forge.workspace = true
recur-provider-claude.workspace = true
recur-view-chat = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true

[lints]
workspace = true

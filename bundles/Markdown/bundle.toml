[[symbol]]
id = "recur.symbols.markdown.heading"
scope = "markup.heading.markdown"
kind = "heading"
# TextMate: extra # → em-space indent so Go to Symbol / Outline nest by level.
transform = '''
s/^\s{0,3}######\s+/\u2003\u2003\u2003\u2003\u2003/
s/^\s{0,3}#####\s+/\u2003\u2003\u2003\u2003/
s/^\s{0,3}####\s+/\u2003\u2003\u2003/
s/^\s{0,3}###\s+/\u2003\u2003/
s/^\s{0,3}##\s+/\u2003/
s/^\s{0,3}#\s+//
s/\s+#+\s*$//
'''

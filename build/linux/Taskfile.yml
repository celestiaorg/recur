version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for building on non-Linux hosts (build/linux/Dockerfile).
  BUILD_IMAGE: recur-linux-build

  # Same opt-in as build/darwin/Taskfile.yml: RECUR_DEBUG=1 keeps the inspector.
  DEVTOOLS_TAG: '{{if or (eq .RECUR_DEBUG "1") (eq .RECUR_DEBUG "true")}}devtools{{end}}'
  EFFECTIVE_EXTRA_TAGS: '{{.DEVTOOLS_TAG}}{{if and .DEVTOOLS_TAG .EXTRA_TAGS}},{{end}}{{.EXTRA_TAGS}}'

tasks:
  build:
    summary: Builds the application for Linux (natively on Linux, in Docker elsewhere)
    cmds:
      - task: '{{if eq OS "linux"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          RECUR_DEBUG: '{{.RECUR_DEBUG}}'

  build:native:
    summary: Builds natively on Linux (needs gcc, pkg-config, libgtk-4-dev, libwebkitgtk-6.0-dev)
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
          RECUR_DEBUG:
            ref: .RECUR_DEBUG
      - task: common:generate:help-skill
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      OUTPUT: '{{ .OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME) }}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EFFECTIVE_EXTRA_TAGS}}-tags {{.EFFECTIVE_EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EFFECTIVE_EXTRA_TAGS}},{{.EFFECTIVE_EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.TARGET_ARCH}}'

  # simplify: builds for the Docker host arch (arm64 on Apple Silicon); ARCH=amd64
  # runs under emulation and is slow. Use the wails-cross image if that matters.
  build:docker:
    summary: Builds for Linux inside build/linux/Dockerfile (non-Linux hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          DEV:
            ref: .DEV
          RECUR_DEBUG:
            ref: .RECUR_DEBUG
      - task: common:generate:help-skill
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker (or OrbStack) is required to build for Linux on {{OS}}."
    cmds:
      - docker build -q --platform linux/{{.TARGET_ARCH}} -t {{.BUILD_IMAGE}}:{{.TARGET_ARCH}} -f build/linux/Dockerfile build/linux
      - >-
        docker run --rm --platform linux/{{.TARGET_ARCH}}
        -v "{{.ROOT_DIR}}:/app"
        -v "{{.GOMODCACHE}}:/go/pkg/mod"
        -v recur-linux-gocache-{{.TARGET_ARCH}}:/root/.cache/go-build
        {{.BUILD_IMAGE}}:{{.TARGET_ARCH}}
        go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}" .
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      # Never clobber the host's bin/recur (macOS app) with a Linux binary.
      OUTPUT: '{{ .OUTPUT | default (printf "%s/%s-linux-%s/%s" .BIN_DIR .APP_NAME .TARGET_ARCH .APP_NAME) }}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EFFECTIVE_EXTRA_TAGS}}-tags {{.EFFECTIVE_EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EFFECTIVE_EXTRA_TAGS}},{{.EFFECTIVE_EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      GOMODCACHE:
        sh: go env GOMODCACHE

  package:
    summary: Packages bin/recur-linux-<arch>.tar.gz (recur + recur-cli + icon)
    cmds:
      - rm -rf "{{.PKG_DIR}}" && mkdir -p "{{.PKG_DIR}}"
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          RECUR_DEBUG: '{{.RECUR_DEBUG}}'
          OUTPUT: '{{.PKG_DIR}}/{{.APP_NAME}}'
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.TARGET_ARCH}} go build -trimpath -buildvcs=false -ldflags="-w -s {{.CLI_LDFLAGS}}" -o "{{.PKG_DIR}}/recur-cli" ./cmd/recur
      - cp build/appicon.png "{{.PKG_DIR}}/recur.png"
      - tar -C "{{.BIN_DIR}}" -czf "{{.PKG_DIR}}.tar.gz" "{{.APP_NAME}}-linux-{{.TARGET_ARCH}}"
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      PKG_DIR: '{{.BIN_DIR}}/{{.APP_NAME}}-linux-{{.TARGET_ARCH}}'

  run:
    summary: Runs the Linux app (natively on Linux; elsewhere in a Docker desktop opened in the browser)
    cmds:
      - task: '{{if eq OS "linux"}}run:native{{else}}run:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          RECUR_DEBUG: '{{.RECUR_DEBUG}}'

  run:native:
    internal: true
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  # Home (~/.config/Recur, ~/.recur, installed tools) persists in a Docker
  # volume; `docker volume rm recur-linux-home-<arch>` resets to first run.
  # Ctrl+C or Recur's File > Quit stops the container.
  run:docker:
    internal: true
    cmds:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          RECUR_DEBUG: '{{.RECUR_DEBUG}}'
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.TARGET_ARCH}} go build -trimpath -buildvcs=false -ldflags="{{.CLI_LDFLAGS}}" -o "{{.APP_DIR}}/recur-cli" ./cmd/recur
      - docker build -q --platform linux/{{.TARGET_ARCH}} -t recur-linux-desktop:{{.TARGET_ARCH}} -f build/linux/Dockerfile.desktop build/linux
      - docker rm -f recur-linux >/dev/null 2>&1 || true
      - |
        URL="http://127.0.0.1:{{.VNC_PORT}}/vnc.html?autoconnect=1&resize=scale"
        echo "Recur (Linux) desktop: $URL"
        (for i in $(seq 120); do curl -fs "$URL" >/dev/null 2>&1 && break; sleep 0.5; done; open "$URL" 2>/dev/null) &
        docker run --rm --init --name recur-linux --platform linux/{{.TARGET_ARCH}} \
          -p 127.0.0.1:{{.VNC_PORT}}:6080 \
          -v recur-linux-home-{{.TARGET_ARCH}}:/home/dev \
          -v "{{.ROOT_DIR}}/{{.APP_DIR}}:/opt/recur:ro" \
          recur-linux-desktop:{{.TARGET_ARCH}}
    vars:
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      VNC_PORT: '{{.VNC_PORT | default 6080}}'
      APP_DIR: '{{.BIN_DIR}}/{{.APP_NAME}}-linux-{{.TARGET_ARCH}}'

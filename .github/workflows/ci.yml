name: CI

# Branch protection requires the "CI success" job (and cla.yml's "cla"). To add
# a check, add a job here and list it under ci-success.needs; no GitHub
# settings change. merge_group runs it again on the merge queue's commit.
#
# Tools (node, pnpm, nfpm, dmgbuild) come from mise.toml through mise-action;
# Rust from rust-toolchain.toml. mise routes cargo through mbx;
# mr-boxington-action caches target/ and Cargo's downloads, and turns off mbx's
# managed target dirs so the runner holds one copy of the build. Only pushes to
# main save that cache: one set of the four is about 10 GB, the repository's
# whole cache limit, and a pull request's entries are readable by that pull
# request alone, so saving them evicts the baseline every run restores. Mac
# jobs run on macos-26: `generate:icons` compiles build/appicon.icon with
# actool, which needs Xcode 26+.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push to a branch or pull request cancels its running CI, so main tests only its
# latest commit instead of queueing every push behind the one before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Full debuginfo for every crate fills the Linux runner's disk, and so does
# incremental state on top of a restored target (the cache drops it anyway).
# mbx moves build-script output out of target/ by default, where the target
# cache misses it and every build script reruns after a restore.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  MBX_SHARE_OUT_DIR: "0"

jobs:
  # Platform-independent checks, so they run once; the jobs below wait on them.
  sanity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: build/set-version.sh --check
      - run: cargo fmt --all --check
      - run: cargo test -p recur-layering

  # Clippy and the tests run on both platforms: cfg(target_os) code (AppKit,
  # WKWebView, GTK, WebKitGTK) only compiles on its own OS.
  mac:
    needs: sanity
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The Go bundle's gofmt test.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: jdx/mise-action@v5
      # See the linux job.
      - run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: v1-${{ hashFiles('vendor/**') }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: mise run test

  # GPUI's X11/Wayland backend and WebKitGTK 6.0 for the HTML preview. Those
  # tests open WebKitGTK, so they run under Xvfb, with WebKit's sandbox off
  # (the runner's AppArmor blocks bubblewrap's namespaces).
  linux:
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The all-features debug target is about 34 GB. Runners with the 72 GB
      # disk start with 13 GB free and ran out, so they need the cleanup (2 to 5
      # minutes); the 145 GB ones start with 86 GB and skip it.
      - id: disk
        run: echo "free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" >> "$GITHUB_OUTPUT"
      - if: fromJSON(steps.disk.outputs.free_gb) < 60
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev xvfb ripgrep libxml2-utils
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # Tests commit in temp repos; the runner's hostname gives git no identity.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: jdx/mise-action@v5
      # Cargo judges path deps by mtime and checkout makes every file new, so a
      # restored target rebuilt vendor/gpui-pre and everything above it. Pinned
      # mtimes keep vendor/ fresh; its hash in the generation starts a new
      # cache whenever it changes. The package jobs put "package" in the
      # generation, not cache-key-suffix, which restore keys leave out.
      - run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      # Trial: the content-addressed `objects` payload. Checkout gives every
      # source file a new mtime, so with the `target` payload (the other jobs)
      # Cargo rebuilds every workspace crate on every run; mbx's store replays
      # the unchanged ones. Compare this job's clippy and nextest build times
      # and `mbx[cache]` hit counts with mac's before moving the others over.
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: v1-${{ hashFiles('vendor/**') }}
          github-cache-mode: objects
          isolate-objects-cache: true
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
      - run: xvfb-run -a cargo nextest run --workspace --all-features --locked
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      - run: cargo test --workspace --doc --all-features --locked
      # The shipped bundles behave the same on both platforms; check them once.
      - run: mise run lint:bundles
      - run: mise run test:bundles
      - if: always()
        run: df -h / && du -sh target/debug/* ~/.cache/* 2>/dev/null | sort -h | tail -15

  # The release builds take 20 to 30 minutes, so pull requests skip them and the
  # merge queue runs them beside the tests, not after.
  #
  # Ad-hoc signed arm64 Recur.app in a DMG, plus the updater zip.
  package-mac:
    if: github.event_name != 'pull_request'
    needs: sanity
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # See the linux job.
      - run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: v1-package-${{ hashFiles('vendor/**') }}
      - run: mise run macos:package
      - run: hdiutil verify "target/package/Recur.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Recur-macos-arm64
          path: target/package/Recur.dmg
          retention-days: 14

  # target/package/recur-linux-amd64.{tar.gz,deb,rpm,pkg.tar.zst}, installed and
  # launched in a clean Debian 13 container by linux:smoke.
  package-linux:
    if: github.event_name != 'pull_request'
    needs: sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # See the linux job.
      - id: disk
        run: echo "free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" >> "$GITHUB_OUTPUT"
      - if: fromJSON(steps.disk.outputs.free_gb) < 60
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: true
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: jdx/mise-action@v5
      # See the linux job.
      - run: git ls-files -z vendor | xargs -0 touch -t 200001010000
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: v1-package-${{ hashFiles('vendor/**') }}
      - run: mise run linux:package
      - run: mise run linux:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Recur-linux-amd64
          path: |
            target/package/recur-linux-amd64.tar.gz
            target/package/recur-linux-amd64.deb
            target/package/recur-linux-amd64.rpm
            target/package/recur-linux-amd64.pkg.tar.zst
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [sanity, mac, linux, package-mac, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

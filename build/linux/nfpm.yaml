# .deb / .rpm for `wails3 task linux:package`, which sets GOARCH, RECUR_VERSION
# and PKG_DIR. Packages are PGP-signed when RECUR_PGP_KEY names an armored
# private key file (passphrase in NFPM_PASSPHRASE); otherwise unsigned.
name: recur
arch: ${GOARCH}
platform: linux
version: ${RECUR_VERSION}
maintainer: recur.build
vendor: recur.build
homepage: https://recur.build
description: Run autonomous AI coding loops locally.
section: devel

# The app links nothing onto PATH or into the menu when run from /opt/recur
# (cliinstall.PackagedDir): the package owns those, so removal cleans them up.
contents:
  - src: ${PKG_DIR}/recur
    dst: /opt/recur/recur
    expand: true
  - src: ${PKG_DIR}/recur-cli
    dst: /opt/recur/recur-cli
    expand: true
  - src: ${PKG_DIR}/recur.png
    dst: /opt/recur/recur.png
    expand: true
  - src: /opt/recur/recur-cli
    dst: /usr/bin/recur
    type: symlink
  - src: build/linux/org.wails.recur.desktop
    dst: /usr/share/applications/org.wails.recur.desktop

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

deb:
  signature:
    key_file: ${RECUR_PGP_KEY}
rpm:
  signature:
    key_file: ${RECUR_PGP_KEY}

[[snippet]]
id = "recur.html.html"
name = "HTML5 document"
tabTrigger = "html"
scope = "text.html, source.svelte, source.vue"
fileGlob = "*.{html,htm,svelte,vue}"
order = 21
body = '''
<!DOCTYPE html>
<html lang="${1:en}">
<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<title>$2</title>

	$3
</head>
<body>
	$0
</body>
</html>
'''


name: CI

# Branch protection requires only the "CI success" job. To add a check, add a
# job here and list it under ci-success.needs; no GitHub settings change.
#
# Tools (node, pnpm, nfpm, dmgbuild) come from mise.toml through mise-action;
# Rust from rust-toolchain.toml. Mac jobs run on macos-26: `generate:icons`
# compiles build/appicon.icon with actool, which needs Xcode 26+.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt, clippy, the layering check, the workspace tests and the shipped
  # bundles' lint and engine tests.
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint
      - run: mise run test
      - run: mise run lint:bundles
      - run: mise run test:bundles

  # GPUI's X11/Wayland backend and WebKitGTK 6.0 for the HTML preview. Those
  # tests open WebKitGTK, so they run under Xvfb, with WebKit's sandbox off
  # (the runner's AppArmor blocks bubblewrap's namespaces).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev xvfb ripgrep libxml2-utils
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav
      # Tests commit in temp repos; the runner's hostname gives git no identity.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: xvfb-run -a cargo test --workspace --all-features --locked
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"

  # Ad-hoc signed arm64 Recur.app in a DMG, plus the updater zip.
  package-mac:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: mise run package
      - run: hdiutil verify "target/package/Recur.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Recur-macos-arm64
          path: target/package/Recur.dmg
          retention-days: 14

  # target/package/recur-linux-amd64.{tar.gz,deb,rpm}, installed and
  # launched in a clean Debian 13 container by linux:smoke.
  package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: mise run linux:package
      - run: mise run linux:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Recur-linux-amd64
          path: |
            target/package/recur-linux-amd64.tar.gz
            target/package/recur-linux-amd64.deb
            target/package/recur-linux-amd64.rpm
          retention-days: 14

  ci-success:
    name: CI success
    if: always()
    needs: [mac, linux, package-mac, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

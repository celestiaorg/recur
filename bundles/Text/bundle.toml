# --- shebang + inline body --------------------------------------------------

[[command]]
id = "recur.text.word-count"
name = "Word Count"
category = "Text"
order = 90
input = "selection"
fallbackInput = "document"
output = "showAsToast"
triggers = ["palette"]
keyEquivalent = "ctrl+shift+n"
interpreter = "shebang"
body = '''
#!/usr/bin/env bash
# Count words / lines / chars of stdin.
text=$(cat)
words=$(printf '%s' "$text" | wc -w | tr -d ' ')
lines=$(printf '%s' "$text" | wc -l | tr -d ' ')
chars=$(printf '%s' "$text" | wc -c | tr -d ' ')
printf '%s words · %s lines · %s chars\n' "$words" "$lines" "$chars"
'''

[[command]]
id = "recur.text.wrap-at-column"
name = "Wrap at Column"
category = "Text"
order = 80
input = "selection"
fallbackInput = "document"
output = "replaceInput"
triggers = ["palette"]
interpreter = "shebang"
prompts = [
  { name = "width", label = "Column width", type = "text", default = "80" },
]
body = '''
#!/usr/bin/env bash
width="${RECUR_INPUT_WIDTH:-80}"
fold -s -w "$width"
'''


[package]
name = "recur-ui-parity"
description = "Renders recur-ui gallery scenes headlessly and diffs them against the Svelte reference captures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ui-parity"
path = "src/main.rs"

[dependencies]
recur-ui = { workspace = true, features = ["gallery"] }
recur-editor = { workspace = true, features = ["gallery"] }
recur-terminal-view = { workspace = true, features = ["gallery"] }
recur-app = { workspace = true, features = ["gallery"] }
gpui-kit = { workspace = true, features = ["test-support"] }
image = { workspace = true, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true

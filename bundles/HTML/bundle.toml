[bundle]
name = "HTML"
id = "recur.html"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "vscode-html-language-server"
languages = ["html"]
fileGlob = ["*.html", "*.htm"]
command = "vscode-html-language-server"
args = ["--stdio"]
managed = "vscode-html-language-server"

[[languageServer]]
id = "vscode-css-language-server"
languages = ["css", "scss", "less"]
fileGlob = ["*.css", "*.scss", "*.sass", "*.less"]
command = "vscode-css-language-server"
args = ["--stdio"]
managed = "vscode-css-language-server"

# Tab-trigger snippets from TextMate HTML.tmbundle (HTML5 + HTML 4.01
# doctypes; no XHTML) + wrap-selection (⌃W) + insert tag pair (⌃<) +
# <br> (⌃↩). Grammar lives in Languages.
#
# Markup commands/snippets (insert-tag, wrap, element tabs) also apply to
# JSX/TSX, Astro, MDX, and Handlebars. Document-level snippets (doctype,
# html/head/body, script/style/meta) stay on HTML / Svelte / Vue.

[[command]]
id = "recur.html.insert-tag"
name = "Insert Open/Close Tag"
category = "HTML"
order = 5
scope = "text.html, source.svelte, source.vue, source.tsx, source.js.jsx, source.astro"
fileGlob = "*.{html,htm,svelte,vue,tsx,jsx,astro,mdx,hbs,handlebars}"
input = "selection"
fallbackInput = "word"
output = "insertSnippet"
triggers = ["palette"]
keyEquivalent = "ctrl+<"
interpreter = "typescript"
script = "src/insert-tag.ts"

[[snippet]]
id = "recur.html.wrap"
name = "Wrap Selection in Tag"
keyEquivalent = "ctrl+w"
scope = "text.html, source.svelte, source.vue, source.tsx, source.js.jsx, source.astro"
fileGlob = "*.{html,htm,svelte,vue,tsx,jsx,astro,mdx,hbs,handlebars}"
order = 10
body = '''
<${1:p}>${2:$TM_SELECTED_TEXT}</$1>
'''

[[snippet]]
id = "recur.html.em"
name = "Emphasize"
keyEquivalent = "cmd+i"
scope = "text.html, source.svelte, source.vue, source.tsx, source.js.jsx, source.astro"
fileGlob = "*.{html,htm,svelte,vue,tsx,jsx,astro,mdx,hbs,handlebars}"
order = 11
body = '''
<em>${1:$TM_SELECTED_TEXT}</em>
'''

[[snippet]]
id = "recur.html.nbsp"
name = "Non-Breaking Space"
keyEquivalent = "opt+space"
scope = "text.html, source.svelte, source.vue, source.tsx, source.js.jsx, source.astro"
fileGlob = "*.{html,htm,svelte,vue,tsx,jsx,astro,mdx,hbs,handlebars}"
order = 12
body = '''
&nbsp;
'''

[[snippet]]
id = "recur.html.br"
name = "Br"
tabTrigger = "br"
keyEquivalent = "ctrl+enter"
scope = "text.html, source.svelte, source.vue, source.tsx, source.js.jsx, source.astro"
fileGlob = "*.{html,htm,svelte,vue,tsx,jsx,astro,mdx,hbs,handlebars}"
order = 13
body = '''

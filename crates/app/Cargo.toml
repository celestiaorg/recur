[package]
name = "recur-app"
description = "The GPUI application shell: window, titlebar, native menu, routing, overlays host and global keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Gallery scenes (full-window shell and sidebar states on the mock).
gallery = ["recur-services/mock", "recur-ui/gallery", "recur-view-core/gallery", "dep:serde"]
# Open Developer Tools (the GPUI inspector) in release builds.
devtools = ["gpui-kit/inspector"]

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-services.workspace = true
recur-domain.workspace = true
recur-platform.workspace = true
recur-view-core.workspace = true
recur-view-sidebar.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[dev-dependencies]
parking_lot.workspace = true
gpui = { workspace = true, features = ["test-support"] }
recur-services = { workspace = true, features = ["mock"] }
recur-app = { path = ".", features = ["gallery"] }
tempfile.workspace = true

[lints]
workspace = true

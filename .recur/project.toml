# Recur project settings

setup_cmd = """
set -e
# install tools (node, pnpm, nfpm, dmgbuild)
mise install

if command -v sqlite3 >/dev/null 2>&1; then
  # Recur uses WAL. Byte-copying recur.db misses in-WAL rows (often hours).
  # VACUUM INTO snapshots through the WAL; retry if Recur's writer is busy.
  if [ "$(uname)" = Darwin ]; then
    SRC="$HOME/Library/Application Support/Recur"
  else
    SRC="${XDG_CONFIG_HOME:-$HOME/.config}/Recur"
  fi
  DEST="$HOME/.recur/data/$RECUR_WORKSPACE_ID"
  rm -rf "$DEST"
  mkdir -p "$DEST"
  copied=
  for i in 1 2 3 4 5; do
    rm -f "$DEST/recur.db"
    if sqlite3 "$SRC/recur.db" "PRAGMA busy_timeout=60000; VACUUM INTO '$DEST/recur.db';"; then
      copied=1
      break
    fi
    sleep 2
  done
  test -n "$copied"
  rsync -a --exclude 'recur.db*' --exclude 'open.sock' "$SRC/" "$DEST/"

  # Remove running agents so they don't auto-resume in the copied instance.
  sqlite3 "$DEST/recur.db" <<'SQL'
UPDATE workspaces
SET doc_json = json_set(
  json_remove(doc_json, '$.checkpoint'),
  '$.state', 'paused',
  '$.phase', 'copied for dogfood'
)
WHERE COALESCE(json_extract(doc_json, '$.archived'), 0) = 0
  AND (
    json_extract(doc_json, '$.state') IN (
      'planning', 'coding', 'reviewing', 'verifying', 'responding', 'queued'
    )
    OR (
      json_extract(doc_json, '$.state') = 'paused'
      AND json_extract(doc_json, '$.phase') = 'interrupted'
    )
  );

UPDATE agents
SET doc_json = json_remove(
  json_set(doc_json, '$.status', 'idle'),
  '$.sessionId'
)
WHERE json_extract(doc_json, '$.status') IN ('working', 'directing', 'planning')
   OR json_extract(doc_json, '$.sessionId') IS NOT NULL;
SQL
else
  printf '%s\n' 'sqlite3 CLI is unavailable; skipping the optional Recur data snapshot.' >&2
fi
"""

teardown_cmd = 'rm -rf "$HOME/.recur/data/$RECUR_WORKSPACE_ID"'
app_url = ""

# Secrets: .env, .env.local, .recur/.env, .recur/.env.local (gitignored).
env = """
RECUR_DATA_DIR=$HOME/.recur/data/$RECUR_WORKSPACE_ID
RECUR_INSTANCE_LABEL=$RECUR_BRANCH
"""
copy_files = ''

[[run]]
name = "dev"
cmd = "mise run dev"

[[run]]
name = "lint"
cmd = "mise run lint"

[[run]]
name = "test"
cmd = "mise run test"

[[run]]
name = "check"
cmd = "mise run check"

[[run]]
name = "check cursor sdk"
cmd = "mise run check:cursor-sdk-pin"

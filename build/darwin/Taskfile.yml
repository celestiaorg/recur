version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_IDENTITY: "Developer ID Application: Your Company (TEAMID)"
  # KEYCHAIN_PROFILE: "my-notarize-profile"
  # ENTITLEMENTS: "build/darwin/entitlements.plist"

  # Local builds are ad-hoc signed, so macOS forgets folder permissions on every
  # rebuild. Set RECUR_SIGN_IDENTITY to a code-signing cert name (a self-signed
  # one from Keychain Access works) to keep them across builds.
  LOCAL_SIGN_IDENTITY: '{{.RECUR_SIGN_IDENTITY | default "-"}}'

  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross

  # Packaged bundle is Recur.app; the executable inside stays APP_NAME (recur).
  APP_BUNDLE_NAME: Recur

  # Wails compiles the WebKit inspector out of production. Opt in at package
  # time: RECUR_DEBUG=1 wails3 task package  (View → Open Developer Tools / ⌥⌘I).
  # That flag also skips frontend minify and emits sourcemaps.
  DEVTOOLS_TAG: '{{if or (eq .RECUR_DEBUG "1") (eq .RECUR_DEBUG "true")}}devtools{{end}}'
  EFFECTIVE_EXTRA_TAGS: '{{.DEVTOOLS_TAG}}{{if and .DEVTOOLS_TAG .EXTRA_TAGS}},{{end}}{{.EXTRA_TAGS}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          RECUR_DEBUG: '{{.RECUR_DEBUG}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
          RECUR_DEBUG:
            ref: .RECUR_DEBUG
      - task: common:generate:icons
      - task: common:generate:help-skill
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EFFECTIVE_EXTRA_TAGS}}-tags {{.EFFECTIVE_EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EFFECTIVE_EXTRA_TAGS}},{{.EFFECTIVE_EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          RECUR_DEBUG:
            ref: .RECUR_DEBUG
      - task: common:generate:icons
      - task: common:generate:help-skill
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EFFECTIVE_EXTRA_TAGS}}-e EXTRA_TAGS="{{.EFFECTIVE_EXTRA_TAGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      # Handles both relative (=> ../) and absolute (=> /) paths
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle
        vars:
          UNIVERSAL: "true"


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      # Also clears a stale lowercase recur.app on case-insensitive volumes.
      - rm -rf "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/MacOS"
      - task: '{{if eq .UNIVERSAL "true"}}embed:cli:universal{{else}}embed:cli{{end}}'
        vars:
          APP_BUNDLE: "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents"
      - task: stamp:version
        vars:
          PLIST: "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/Info.plist"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  stamp:version:
    summary: Writes VERSION (RECUR_VERSION or git describe) into an Info.plist
    internal: true
    cmds:
      - plutil -replace CFBundleShortVersionString -string "{{.VERSION}}" "{{.PLIST}}"
      - plutil -replace CFBundleVersion -string "{{.VERSION}}" "{{.PLIST}}"

  embed:cli:
    summary: Builds the Recur CLI into Contents/MacOS/recur-cli (not the GUI)
    internal: true
    cmds:
      - mkdir -p "{{.APP_BUNDLE}}/Contents/MacOS"
      - go build -trimpath -buildvcs=false -ldflags="-w -s {{.CLI_LDFLAGS}}" -o "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli" ./cmd/recur
      - chmod +x "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli"
    env:
      CGO_ENABLED: "0"
      GOOS: darwin
      # Same default as build:docker (arm64 when ARCH is unset on a
      # non-mac host). Native macOS packaging uses the host ARCH.
      GOARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else if eq OS "darwin"}}{{ARCH}}{{else}}arm64{{end}}'

  embed:cli:universal:
    summary: Builds a universal (arm64+amd64) CLI into Contents/MacOS/recur-cli
    internal: true
    cmds:
      - mkdir -p "{{.APP_BUNDLE}}/Contents/MacOS"
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-w -s {{.CLI_LDFLAGS}}" -o "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-amd64" ./cmd/recur
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="-w -s {{.CLI_LDFLAGS}}" -o "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-arm64" ./cmd/recur
      - task: '{{if eq OS "darwin"}}embed:cli:lipo:native{{else}}embed:cli:lipo:go{{end}}'
        vars:
          APP_BUNDLE:
            ref: .APP_BUNDLE

  embed:cli:lipo:native:
    summary: lipo CLI slices with native lipo
    internal: true
    cmds:
      - lipo -create -output "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli" "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-amd64" "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-arm64"
      - rm "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-amd64" "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-arm64"
      - chmod +x "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli"

  embed:cli:lipo:go:
    summary: lipo CLI slices with wails3 tool lipo
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli" -input "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-amd64" -input "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-arm64"
      - rm -f "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-amd64" "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli-arm64"
      - chmod +x "{{.APP_BUNDLE}}/Contents/MacOS/recur-cli"

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - |
        CLI="{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/MacOS/recur-cli"
        if [ -f "$CLI" ]; then
          codesign --force --sign "{{.LOCAL_SIGN_IDENTITY}}" "$CLI"
        fi
      - codesign --force --deep --sign "{{.LOCAL_SIGN_IDENTITY}}" "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - task: embed:cli
        vars:
          APP_BUNDLE: "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - task: stamp:version
        vars:
          PLIST: "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - |
        CLI="{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/recur-cli"
        if [ -f "$CLI" ]; then
          codesign --force --sign "{{.LOCAL_SIGN_IDENTITY}}" "$CLI"
        fi
      - codesign --force --deep --sign "{{.LOCAL_SIGN_IDENTITY}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Configure SIGN_IDENTITY in the vars section at the top of this file.
    deps:
      - task: package
    cmds:
      - task: sign:cli
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app" --identity "{{.SIGN_IDENTITY}}" {{if .ENTITLEMENTS}}--entitlements {{.ENTITLEMENTS}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_IDENTITY}}" ]'
        msg: "SIGN_IDENTITY is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"

  sign:cli:
    summary: Signs Contents/MacOS/recur-cli inside-out before the bundle
    internal: true
    cmds:
      - |
        CLI="{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app/Contents/MacOS/recur-cli"
        if [ -f "$CLI" ]; then
          codesign --force --sign "{{.SIGN_IDENTITY}}" --timestamp --options runtime {{if .ENTITLEMENTS}}--entitlements {{.ENTITLEMENTS}}{{end}} "$CLI"
        fi

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Configure SIGN_IDENTITY and KEYCHAIN_PROFILE in the vars section at the top of this file.

      Setup (one-time):
        wails3 signing credentials --apple-id "you@email.com" --team-id "TEAMID" --password "app-specific-password" --profile "my-profile"
    deps:
      - task: package
    cmds:
      - task: sign:cli
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_BUNDLE_NAME}}.app" --identity "{{.SIGN_IDENTITY}}" {{if .ENTITLEMENTS}}--entitlements {{.ENTITLEMENTS}}{{end}} --notarize --keychain-profile {{.KEYCHAIN_PROFILE}}
    preconditions:
      - sh: '[ -n "{{.SIGN_IDENTITY}}" ]'
        msg: "SIGN_IDENTITY is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"
      - sh: '[ -n "{{.KEYCHAIN_PROFILE}}" ]'
        msg: "KEYCHAIN_PROFILE is required. Set it in the vars section at the top of build/darwin/Taskfile.yml"

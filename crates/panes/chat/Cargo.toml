[package]
name = "recur-view-chat"
description = "The agent chat: transcript, composer, cards and pickers, and the Ask Recur panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Read access to the chat's internals for other crates' specs (`testing`).
test-support = []

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-content.workspace = true
recur-textmate.workspace = true
recur-services.workspace = true
recur-domain.workspace = true
recur-engine.workspace = true
recur-agent.workspace = true
recur-agent-tools.workspace = true
recur-issues.workspace = true
recur-bundles.workspace = true
recur-view-core.workspace = true
recur-view-widgets.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
futures.workspace = true
base64.workspace = true
chrono.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
recur-services = { workspace = true, features = ["fake"] }
pretty_assertions.workspace = true
recur-app.workspace = true
parking_lot.workspace = true

[lints]
workspace = true

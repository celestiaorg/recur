[package]
name = "recur-view-chat"
description = "The agent chat: transcript, composer, cards and pickers, and the Ask Recur panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Parity scenes for `rust/tools/ui-parity` (`gallery::build`).
gallery = ["recur-services/mock", "recur-ui/gallery", "recur-content/gallery"]

[dependencies]
gpui-kit.workspace = true
recur-ui.workspace = true
recur-content.workspace = true
recur-textmate.workspace = true
recur-services.workspace = true
recur-domain.workspace = true
recur-engine.workspace = true
recur-forge.workspace = true
recur-agent.workspace = true
recur-agent-tools.workspace = true
recur-issues.workspace = true
recur-bundles.workspace = true
recur-view-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
futures.workspace = true
base64.workspace = true
chrono.workspace = true
smallvec.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
recur-services = { workspace = true, features = ["mock"] }
recur-view-chat = { path = ".", features = ["gallery"] }
pretty_assertions.workspace = true
recur-app = { workspace = true, features = ["gallery"] }
parking_lot.workspace = true

[lints]
workspace = true

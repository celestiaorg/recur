name: Release

# Pushing a vX.Y.Z tag builds a universal "Recur.app" (stamping X.Y.Z into
# Info.plist) in a styled DMG plus its updater zip, and the recur Linux
# tarballs, .debs and .rpms, in parallel. Only once every build succeeds does
# `publish` create the GitHub release and attach them all with a
# SHA256SUMS and the signed manifest.json the in-app updater reads
# (RECUR_UPDATE_URL), so a failed build never leaves a partial release.
#
# With all the secrets below the app and the DMG are Developer ID signed,
# notarized, and stapled. With only the MACOS_* ones they are signed but not
# notarized, which still keeps users' macOS folder permissions across updates.
# With none it ships ad-hoc signed. Unless notarized, users clear quarantine per
# README "Installing".
#
# Signing secrets:
#   MACOS_CERT_P12_BASE64  code-signing cert + key, `base64 -i cert.p12`
#   MACOS_CERT_PASSWORD    password for that .p12
#   MACOS_SIGN_IDENTITY    cert common name, defaults to "Developer ID Application"
#   APPLE_ID               Apple ID email used for notarization
#   APPLE_TEAM_ID          10-character team ID
#   APPLE_APP_PASSWORD     app-specific password for APPLE_ID
#
# With LINUX_PGP_KEY the .deb and .rpm are PGP-signed (nfpm, at package time);
# without it they ship unsigned.
#   LINUX_PGP_KEY          armored private key, `gpg --armor --export-secret-keys <id>`
#   LINUX_PGP_PASSPHRASE   its passphrase, if any
#
# Public release secrets:
#   RELEASES_TOKEN         token with contents:write on celestiaorg/recur-releases,
#                          the public binaries-only repo every release is mirrored
#                          to (public download page + in-app updater). It needs
#                          one commit so release tags can be cut.
#   UPDATER_SIGNING_KEY    Ed25519 private key (PKCS#8 PEM, or base64 of the raw
#                          key or seed) matching build/updater.key.pub (rotate both
#                          together). Without it and RELEASES_TOKEN, builds ship
#                          without the updater.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' }}
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || 'Developer ID Application' }}
      RECUR_UPDATE_URL: ${{ secrets.UPDATER_SIGNING_KEY != '' && secrets.RELEASES_TOKEN != '' && 'https://github.com/celestiaorg/recur-releases/releases/latest/download/manifest.json' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Import signing certificate and notary credentials
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC"
          security default-keychain -s "$KC"
          if [ "$HAS_NOTARY" = true ]; then
            xcrun notarytool store-credentials recur-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
              --keychain "$KC"
          fi

      # build/darwin/package.sh signs (and with KEYCHAIN_PROFILE notarizes and
      # staples) the app and the DMG. The temp keychain holds exactly one
      # identity, so the common-name prefix is enough for codesign to select it.
      - name: Build, sign, notarize
        run: |
          export UNIVERSAL=true VERSION="${GITHUB_REF_NAME#v}"
          if [ "$HAS_SIGNING" != true ]; then unset SIGN_IDENTITY; fi
          if [ "$HAS_NOTARY" = true ]; then export KEYCHAIN_PROFILE=recur-notary; fi
          mise run package

      - name: Verify
        run: |
          APP="target/package/Recur.app"
          codesign --verify --deep --strict "$APP"
          if [ "$HAS_NOTARY" = true ]; then spctl --assess --type execute "$APP"; fi
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          for bin in recur recur-cli; do lipo "$APP/Contents/MacOS/$bin" -verify_arch arm64 x86_64; done
          DMG="target/package/Recur.dmg"
          if [ "$HAS_NOTARY" = true ]; then spctl --assess --type open --context context:primary-signature "$DMG"; fi
          hdiutil verify "$DMG"

      - name: Rename
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv "target/package/Recur.dmg" "dist/Recur-$V-macos-universal.dmg"
          mv "target/package/Recur.zip" "dist/Recur-$V-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal
          path: dist/Recur-*-macos-universal.*
          if-no-files-found: error

  # Each arch builds natively (GPUI and WebKitGTK), so arm64 needs an arm runner.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HAS_PGP: ${{ secrets.LINUX_PGP_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libvulkan-dev libgtk-4-dev libwebkitgtk-6.0-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Write PGP signing key
        if: env.HAS_PGP == 'true'
        env:
          LINUX_PGP_KEY: ${{ secrets.LINUX_PGP_KEY }}
        run: |
          printf '%s\n' "$LINUX_PGP_KEY" > "$RUNNER_TEMP/pgp.asc"
          echo "RECUR_PGP_KEY=$RUNNER_TEMP/pgp.asc" >> "$GITHUB_ENV"
      - env:
          NFPM_PASSPHRASE: ${{ secrets.LINUX_PGP_PASSPHRASE }}
        run: VERSION="${GITHUB_REF_NAME#v}" mise run linux:package
      # Installs both packages in a clean Debian 13 container and launches them.
      - if: matrix.arch == 'amd64'
        run: mise run linux:smoke
      - run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for ext in tar.gz deb rpm; do
            mv "target/package/recur-linux-${{ matrix.arch }}.$ext" "dist/Recur-$V-linux-${{ matrix.arch }}.$ext"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/Recur-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-24.04
    env:
      HAS_PUBLIC: ${{ secrets.RELEASES_TOKEN != '' }}
      HAS_UPDATER: ${{ secrets.UPDATER_SIGNING_KEY != '' && secrets.RELEASES_TOKEN != '' }}
    steps:
      - if: env.HAS_UPDATER == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_UPDATER == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: publish
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The same manifest format and key recur_platform::updater verifies,
      # over the macOS zip only.
      - name: Sign update manifest
        if: env.HAS_UPDATER == 'true'
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$UPDATER_SIGNING_KEY" > "$RUNNER_TEMP/updater.key"
          cargo build -q --locked -p recur-platform --bin updater-manifest
          target/debug/updater-manifest manifest --version "$V" --name "Recur $V" --key "$RUNNER_TEMP/updater.key" \
            --url-prefix "https://github.com/celestiaorg/recur-releases/releases/download/$GITHUB_REF_NAME" \
            --output dist/manifest.json "dist/Recur-$V-macos-universal.zip"
          rm "$RUNNER_TEMP/updater.key"
          target/debug/updater-manifest verify --manifest dist/manifest.json --publickey build/updater.key.pub
      # Unversioned copies give the download page stable
      # releases/latest/download/<name> links.
      - name: Latest-download aliases
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd dist && for f in Recur-"$V"-*.{dmg,deb,rpm,tar.gz}; do cp "$f" "${f/-$V/}"; done
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      # This repo is private, so the download page and the updater read the
      # same files from a public, binaries-only mirror. It stays a draft until
      # every asset is up, so latest/download/manifest.json never points
      # at a missing zip.
      - name: Publish public release
        if: env.HAS_PUBLIC == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: celestiaorg/recur-releases
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --target main --title "Recur ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

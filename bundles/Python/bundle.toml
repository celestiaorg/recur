[bundle]
name = "Python"
id = "recur.python"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "basedpyright"
languages = ["python"]
fileGlob = ["*.py", "*.pyi", "*.pyw"]
command = "basedpyright-langserver"
args = ["--stdio"]
managed = "basedpyright"

[[languageServer]]
id = "ruff"
languages = ["python"]
fileGlob = ["*.py", "*.pyi", "*.pyw"]
command = "ruff"
args = ["server"]
managed = "ruff"

[[command]]
id = "recur.python.format-on-save"
name = "Format on Save"
category = "Python"
order = 10
scope = "source.python"
fileGlob = "*.py"
input = "document"
output = "replaceDocument"
triggers = ["willSave"]
interpreter = "shebang"
body = '''
#!/usr/bin/env bash
# Prefer ruff format, then black; pass through if neither is available.
tmp=$(mktemp)
named="${tmp}.py"
trap 'rm -f "$tmp" "$named"' EXIT
cat >"$tmp"
mv "$tmp" "$named"
if command -v ruff >/dev/null 2>&1; then
  if ruff format --quiet "$named" 2>/dev/null; then
    cat "$named"
    exit 0
  fi
fi
if command -v black >/dev/null 2>&1; then
  if black -q "$named" 2>/dev/null; then
    cat "$named"
    exit 0
  fi
fi
cat "$named"
'''

# --- snippets ----------------------------------------------------------------

[[snippet]]
id = "recur.python.def"
name = "def"
tabTrigger = "def"
scope = "source.python"
fileGlob = "*.py"
order = 10
body = '''
def ${1:fname}(${2}):
	"""${3:docstring for ${1:fname}}"""
	${0:pass}
'''

[[snippet]]
id = "recur.python.class"
name = "class"
tabTrigger = "class"
scope = "source.python"
fileGlob = "*.py"
order = 20
body = '''
class ${1:ClassName}(${2:object}):
	"""${3:docstring for ${1:ClassName}}"""
	def __init__(self, ${4:arg}):
		${5:super(${1:ClassName}, self).__init__()}
		self.${4:arg} = ${4:arg}
		$0
'''


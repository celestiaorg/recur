# --- snippets ----------------------------------------------------------------

[[snippet]]
id = "recur.source.quote"
name = "Wrap Quotes"
tabTrigger = "quote"
order = 10
body = '''
"${1:$TM_SELECTED_TEXT}"
'''

# --- symbols (TextMate showInSymbolList; token scopes, not line regex) -------

[[symbol]]
id = "recur.symbols.source.function"
scope = "entity.name.function"
kind = "func"

[[symbol]]
id = "recur.symbols.source.type-class"
scope = "entity.name.type.class"
kind = "class"

[[symbol]]
id = "recur.symbols.source.toc"
scope = "meta.toc-list"
kind = "heading"

[[symbol]]
id = "recur.symbols.source.hide-calls"
scope = "meta.function-call entity.name.function"
show = false

[[symbol]]
id = "recur.symbols.source.hide-support"
scope = "entity.name.function.support"
show = false


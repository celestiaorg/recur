[bundle]
name = "JavaScript"
id = "recur.javascript"
version = "1.0.0"
author = "Recur"

[[languageServer]]
id = "typescript-language-server"
languages = ["typescript", "javascript", "typescriptreact", "javascriptreact", "tsx", "jsx", "vue"]
fileGlob = ["*.{js,jsx,mjs,cjs,ts,tsx,vue}"]
command = "typescript-language-server"
args = ["--stdio"]
managed = "typescript-language-server"

[[command]]
id = "recur.javascript.format-on-save"
name = "Format on Save"
category = "JavaScript"
order = 10
# No single scope: covers JS and TS via fileGlob brace expansion.
fileGlob = "*.{js,jsx,mjs,cjs,ts,tsx}"
input = "document"
output = "replaceDocument"
triggers = ["willSave"]
interpreter = "shebang"
body = '''
#!/usr/bin/env bash
# Prefer deno fmt, then prettier; pass through if neither is available.
tmp=$(mktemp "${TMPDIR:-/tmp}/recur-fmt.XXXXXX")
trap 'rm -f "$tmp"' EXIT
cat >"$tmp"
# Preserve extension so tools pick a parser.
ext="${RECUR_FILENAME##*.}"
case "$ext" in
  js|jsx|mjs|cjs|ts|tsx|json) ;;
  *) ext="js" ;;
esac
named="${tmp}.${ext}"
mv "$tmp" "$named"
trap 'rm -f "$named" "$named.out"' EXIT
if command -v deno >/dev/null 2>&1; then
  if deno fmt --quiet "$named" 2>/dev/null; then
    cat "$named"
    exit 0
  fi
fi
if command -v prettier >/dev/null 2>&1; then
  # Write via a file (not $(…)) so trailing newlines are preserved.
  if prettier "$named" >"$named.out" 2>/dev/null; then
    cat "$named.out"
    exit 0
  fi
fi
cat "$named"
'''

# --- snippets ----------------------------------------------------------------


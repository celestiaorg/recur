# cargo-nextest runs each test in its own process (`mise run test`).

[profile.default]
# Report every failure, not just the first.
fail-fast = false

# Groups replace the in-process locks tests used to share a resource, which do not
# reach across nextest's processes.
[test-groups]
# The updater's staging-dir leak check counts `recur-update-*` dirs in the shared
# temp dir, so no other updater test may stage while it runs.
updater-staging = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(recur-platform) & test(/^updater::tests::/)"
test-group = "updater-staging"

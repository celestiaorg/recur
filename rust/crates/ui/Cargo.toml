[package]
name = "recur-ui"
description = "Recur's design system on GPUI: theme tokens, fonts, icons, and shared widgets matching the web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Widget gallery scenes shared by `examples/gallery.rs` and `rust/tools/ui-parity`.
gallery = []

[dependencies]
gpui-kit.workspace = true
fancy-regex.workspace = true
include_dir.workspace = true
wuff.workspace = true
ttf-parser.workspace = true
unicode-linebreak.workspace = true
resvg.workspace = true
smallvec.workspace = true
base64.workspace = true
image.workspace = true
serde_json.workspace = true
serde.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
recur-ui = { path = ".", features = ["gallery"] }

[lints]
workspace = true

[[test]]
name = "fonts"
harness = false
